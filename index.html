<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Monster Warriors 3D</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: black;
        }

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050505;
            color: white;

            font-size: 24px;

            z-index: 100;
        }

        /* GAME UI */

        #hud {
            position: fixed;

            top: 20px;
            left: 20px;

            color: white;

            z-index: 10;
        }

        #title {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;

            margin-bottom: 10px;
        }

        #healthBackground {
            width: 250px;
            height: 22px;

            background: #4a0000;

            border: 2px solid white;

            border-radius: 10px;

            overflow: hidden;
        }

        #healthBar {
            width: 100%;
            height: 100%;

            background: #22c55e;

            transition: width 0.2s;
        }

        #stats {
            margin-top: 10px;

            font-size: 17px;

            line-height: 1.6;
        }

        /* SKILLS */

        #skills {
            position: fixed;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            gap: 12px;

            z-index: 20;
        }

        .skill {

            width: 90px;
            height: 90px;

            border-radius: 15px;

            border: 2px solid white;

            background: rgba(0,0,0,0.75);

            color: white;

            cursor: pointer;

            font-weight: bold;
        }

        .skill:hover {
            transform: scale(1.08);
        }

        .skill span {
            display: block;

            font-size: 30px;

            margin-bottom: 5px;
        }

        /* HELP */

        #help {

            position: fixed;

            right: 20px;
            bottom: 20px;

            color: white;

            text-align: right;

            font-size: 14px;

            z-index: 10;

        }

        canvas {
            display: block;
        }

    </style>

</head>

<body>

    <div id="loading">
        Loading Heavy Warrior...
    </div>


    <!-- HUD -->

    <div id="hud">

        <div id="title">
            ⚔ MONSTER WARRIORS
        </div>

        ❤️ HEALTH

        <div id="healthBackground">

            <div id="healthBar"></div>

        </div>

        <div id="stats">

            ⭐ Score:
            <span id="score">0</span>

            <br>

            👹 Monsters:
            <span id="monsterCount">0</span>

        </div>

    </div>


    <!-- SKILLS -->

    <div id="skills">

        <button class="skill"
                onclick="attack()">

            <span>⚔️</span>

            ATTACK

        </button>


        <button class="skill"
                onclick="fireSkill()">

            <span>🔥</span>

            FIRE

        </button>


        <button class="skill"
                onclick="lightningSkill()">

            <span>⚡</span>

            LIGHTNING

        </button>


        <button class="skill"
                onclick="dashSkill()">

            <span>💨</span>

            DASH

        </button>

    </div>


    <div id="help">

        WASD = Move<br>

        SHIFT = Run<br>

        SPACE = Attack<br>

        1 = Fire Skill<br>

        2 = Lightning<br>

        3 = Dash

    </div>


<script type="module">

/* =====================================
   IMPORT THREE.JS
===================================== */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* =====================================
   VARIABLES
===================================== */

let scene;
let camera;
let renderer;

let player;

let mixer;

let animations = {};

let currentAction;

let monsters = [];

let health = 100;

let score = 0;

let attacking = false;

let playerSpeed = 0.08;

const keys = {};

const clock = new THREE.Clock();


/* =====================================
   START
===================================== */

init();


function init() {

    /* SCENE */

    scene = new THREE.Scene();

    scene.background =
    new THREE.Color(0x1a2633);


    scene.fog =
    new THREE.Fog(
        0x1a2633,
        20,
        100
    );


    /* CAMERA */

    camera =
    new THREE.PerspectiveCamera(

        70,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );


    camera.position.set(
        0,
        5,
        8
    );


    /* RENDERER */

    renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.shadowMap.enabled =
    true;


    renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


    document.body.appendChild(
        renderer.domElement
    );


    /* LIGHT */

    const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );


    sun.position.set(
        10,
        20,
        10
    );


    sun.castShadow = true;


    sun.shadow.mapSize.width =
    2048;


    sun.shadow.mapSize.height =
    2048;


    scene.add(sun);


    /* AMBIENT LIGHT */

    const ambient =
    new THREE.HemisphereLight(

        0x87ceeb,

        0x222222,

        2

    );


    scene.add(ambient);


    /* GROUND */

    createGround();


    /* LOAD PLAYER */

    loadPlayer();


    /* CREATE MONSTERS */

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        createMonster();

    }


    /* EVENTS */

    window.addEventListener(
        "keydown",
        keyDown
    );


    window.addEventListener(
        "keyup",
        keyUp
    );


    window.addEventListener(
        "resize",
        resizeGame
    );


    animate();

}


/* =====================================
   GROUND
===================================== */

function createGround() {

    const geometry =
    new THREE.PlaneGeometry(
        200,
        200
    );


    const material =
    new THREE.MeshStandardMaterial({

        color: 0x324a36,

        roughness: 1

    });


    const ground =
    new THREE.Mesh(
        geometry,
        material
    );


    ground.rotation.x =
    -Math.PI / 2;


    ground.receiveShadow =
    true;


    scene.add(ground);


    /* GRID */

    const grid =
    new THREE.GridHelper(
        200,
        100,
        0x444444,
        0x222222
    );


    scene.add(grid);

}


/* =====================================
   LOAD HEAVY WARRIOR
===================================== */

function loadPlayer() {

    const loader =
    new GLTFLoader();


    loader.load(

        "./assets/HeavyWarrior.glb",


        function(gltf) {

            player =
            gltf.scene;


            /* SCALE CHARACTER */

            player.scale.set(
                1.5,
                1.5,
                1.5
            );


            player.position.set(
                0,
                0,
                0
            );


            /* SHADOWS */

            player.traverse(
            function(object) {

                if (
                    object.isMesh
                ) {

                    object.castShadow =
                    true;

                    object.receiveShadow =
                    true;

                }

            });


            scene.add(player);


            /* ANIMATIONS */

            mixer =
            new THREE.AnimationMixer(
                player
            );


            console.log(
                "ANIMATIONS:"
            );


            gltf.animations.forEach(
            clip => {

                console.log(
                    clip.name
                );


                animations[
                    clip.name.toLowerCase()
                ] =
                mixer.clipAction(
                    clip
                );

            });


            /* START FIRST ANIMATION */

            if (
                gltf.animations.length > 0
            ) {

                currentAction =
                mixer.clipAction(
                    gltf.animations[0]
                );


                currentAction.play();

            }


            document
            .getElementById("loading")
            .style.display =
            "none";

        },


        undefined,


        function(error) {

            console.error(error);


            document
            .getElementById("loading")
            .innerHTML =

            "❌ Cannot load HeavyWarrior.glb<br><br>" +

            "Make sure the file is here:<br>" +

            "assets/HeavyWarrior.glb";

        }

    );

}


/* =====================================
   PLAYER MOVEMENT
===================================== */

function updatePlayer() {

    if (!player) return;


    let moveX = 0;

    let moveZ = 0;


    let speed =
    keys["shift"]

    ? playerSpeed * 2

    : playerSpeed;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        moveZ -= speed;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        moveZ += speed;

    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        moveX -= speed;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        moveX += speed;

    }


    /* MOVE */

    if (
        moveX !== 0 ||
        moveZ !== 0
    ) {

        player.position.x +=
        moveX;


        player.position.z +=
        moveZ;


        /* FACE MOVEMENT DIRECTION */

        const angle =
        Math.atan2(
            moveX,
            moveZ
        );


        player.rotation.y =
        angle;


        /* SIMPLE ANIMATION */

        player.position.y =
        Math.abs(
            Math.sin(
                clock.getElapsedTime() * 8
            )
        ) * 0.03;

    }

    else {

        player.position.y = 0;

    }

}


/* =====================================
   MONSTER
===================================== */

function createMonster() {

    const monster =
    new THREE.Group();


    /* BODY */

    const body =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            0.7,
            1.6,
            8,
            16
        ),

        new THREE.MeshStandardMaterial({

            color: 0x4b1d1d,

            roughness: 0.8

        })

    );


    body.position.y = 1.5;

    body.castShadow = true;


    monster.add(body);


    /* HEAD */

    const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.7,
            24,
            24
        ),

        new THREE.MeshStandardMaterial({

            color: 0x713333

        })

    );


    head.position.y = 2.8;


    monster.add(head);


    /* EYES */

    const eyeMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xff0000

    });


    [-0.25, 0.25].forEach(
    x => {

        const eye =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                0.12,
                12,
                12
            ),

            eyeMaterial

        );


        eye.position.set(
            x,
            2.8,
            0.6
        );


        monster.add(eye);

    });


    /* DATA */

    monster.health = 100;

    monster.speed =
    0.02;


    /* RANDOM SPAWN */

    const angle =
    Math.random() *
    Math.PI * 2;


    const distance =
    15 +
    Math.random() * 10;


    monster.position.set(

        Math.cos(angle) *
        distance,

        0,

        Math.sin(angle) *
        distance

    );


    scene.add(monster);


    monsters.push(monster);

}


/* =====================================
   MONSTER AI
===================================== */

function updateMonsters() {

    if (!player) return;


    for (
        let i =
        monsters.length - 1;

        i >= 0;

        i--
    ) {

        const monster =
        monsters[i];


        const direction =
        new THREE.Vector3()

        .subVectors(
            player.position,
            monster.position
        );


        const distance =
        direction.length();


        /* FACE PLAYER */

        monster.lookAt(

            player.position.x,

            monster.position.y,

            player.position.z

        );


        /* CHASE */

        if (
            distance > 2
        ) {

            direction.normalize();


            monster.position.add(

                direction.multiplyScalar(
                    monster.speed
                )

            );

        }


        /* ATTACK PLAYER */

        if (
            distance < 2
        ) {

            health -=
            0.05;

        }


        /* DEATH */

        if (
            monster.health <= 0
        ) {

            scene.remove(monster);


            monsters.splice(
                i,
                1
            );


            score += 10;

        }

    }


    /* RESPAWN */

    if (
        monsters.length === 0
    ) {

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            createMonster();

        }

    }

}


/* =====================================
   ATTACK
===================================== */

window.attack =
function() {

    if (
        attacking ||
        !player
    ) return;


    attacking = true;


    createSlashEffect();


    damageMonsters(
        4,
        50
    );


    setTimeout(
    () => {

        attacking =
        false;

    },

    500
    );

};


/* =====================================
   FIRE SKILL
===================================== */

window.fireSkill =
function() {

    if (!player) return;


    createExplosionEffect(
        0xff4400,
        5
    );


    damageMonsters(
        7,
        100
    );

};


/* =====================================
   LIGHTNING SKILL
===================================== */

window.lightningSkill =
function() {

    if (!player) return;


    createExplosionEffect(
        0x00aaff,
        7
    );


    damageMonsters(
        10,
        150
    );

};


/* =====================================
   DASH SKILL
===================================== */

window.dashSkill =
function() {

    if (!player) return;


    const direction =
    new THREE.Vector3(
        0,
        0,
        -1
    );


    direction.applyQuaternion(
        player.quaternion
    );


    player.position.add(

        direction.multiplyScalar(
            5
        )

    );


    createExplosionEffect(
        0xffffff,
        2
    );

};


/* =====================================
   DAMAGE MONSTERS
===================================== */

function damageMonsters(
range,
damage
) {

    if (!player) return;


    monsters.forEach(
    monster => {

        const distance =
        monster.position.distanceTo(
            player.position
        );


        if (
            distance < range
        ) {

            monster.health -=
            damage;

        }

    });

}


/* =====================================
   SLASH EFFECT
===================================== */

function createSlashEffect() {

    const geometry =
    new THREE.TorusGeometry(

        1.5,

        0.08,

        8,

        32,

        Math.PI

    );


    const material =
    new THREE.MeshBasicMaterial({

        color: 0xffffaa,

        transparent: true,

        opacity: 1

    });


    const effect =
    new THREE.Mesh(
        geometry,
        material
    );


    effect.position.copy(
        player.position
    );


    effect.position.y =
    1.5;


    effect.rotation.x =
    Math.PI / 2;


    scene.add(effect);


    animateEffect(
        effect,
        material
    );

}


/* =====================================
   EXPLOSION EFFECT
===================================== */

function createExplosionEffect(
color,
size
) {

    const geometry =
    new THREE.SphereGeometry(
        1,
        32,
        32
    );


    const material =
    new THREE.MeshBasicMaterial({

        color: color,

        transparent: true,

        opacity: 0.7

    });


    const effect =
    new THREE.Mesh(
        geometry,
        material
    );


    effect.position.copy(
        player.position
    );


    effect.position.y =
    1.5;


    effect.scale.set(
        0.1,
        0.1,
        0.1
    );


    scene.add(effect);


    let scale = 0.1;


    const timer =
    setInterval(
    () => {

        scale += 0.25;


        effect.scale.set(
            scale * size,
            scale * size,
            scale * size
        );


        material.opacity -=
        0.06;


        if (
            material.opacity <= 0
        ) {

            scene.remove(effect);


            clearInterval(timer);

        }

    },

    30
    );

}


/* =====================================
   ANIMATE EFFECT
===================================== */

function animateEffect(
effect,
material
) {

    let scale = 1;


    const timer =
    setInterval(
    () => {

        scale += 0.15;


        effect.scale.set(
            scale,
            scale,
            scale
        );


        material.opacity -=
        0.06;


        if (
            material.opacity <= 0
        ) {

            scene.remove(effect);


            clearInterval(timer);

        }

    },

    30
    );

}


/* =====================================
   CAMERA
===================================== */

function updateCamera() {

    if (!player) return;


    const target =
    new THREE.Vector3(

        player.position.x,

        player.position.y + 5,

        player.position.z + 8

    );


    camera.position.lerp(
        target,
        0.08
    );


    camera.lookAt(

        player.position.x,

        player.position.y + 1.5,

        player.position.z

    );

}


/* =====================================
   UI
===================================== */

function updateUI() {

    health =
    Math.max(
        health,
        0
    );


    document
    .getElementById("healthBar")
    .style.width =
    health + "%";


    document
    .getElementById("score")
    .textContent =
    score;


    document
    .getElementById("monsterCount")
    .textContent =
    monsters.length;

}


/* =====================================
   KEYBOARD
===================================== */

function keyDown(event) {

    keys[
        event.key.toLowerCase()
    ] = true;


    if (
        event.code === "Space"
    ) {

        attack();

    }


    if (
        event.key === "1"
    ) {

        fireSkill();

    }


    if (
        event.key === "2"
    ) {

        lightningSkill();

    }


    if (
        event.key === "3"
    ) {

        dashSkill();

    }

}


function keyUp(event) {

    keys[
        event.key.toLowerCase()
    ] = false;

}


/* =====================================
   RESIZE
===================================== */

function resizeGame() {

    camera.aspect =
    window.innerWidth /
    window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* =====================================
   GAME LOOP
===================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
    clock.getDelta();


    if (mixer) {

        mixer.update(
            delta
        );

    }


    updatePlayer();

    updateMonsters();

    updateCamera();

    updateUI();


    renderer.render(
        scene,
        camera
    );

}

</script>

</body>
</html>
