<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Box Warriors 3D</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* UI */

#ui {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    color: white;
}

#title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #ffd700;
}

#healthContainer {
    width: 220px;
    height: 22px;
    background: #3b0000;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid white;
}

#healthBar {
    width: 100%;
    height: 100%;
    background: #20d060;
    transition: width 0.2s;
}

#stats {
    margin-top: 12px;
    font-size: 18px;
}

/* Skills */

#skills {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    z-index: 10;
}

.skill {
    width: 80px;
    height: 80px;
    border-radius: 15px;
    border: 3px solid white;
    background: rgba(0,0,0,0.7);
    color: white;
    font-size: 14px;
    cursor: pointer;
}

.skill:hover {
    transform: scale(1.08);
}

.skill span {
    display: block;
    font-size: 28px;
}

/* Instructions */

#instructions {
    position: fixed;
    bottom: 15px;
    right: 20px;
    color: white;
    z-index: 10;
    text-align: right;
    font-size: 14px;
}

/* Start screen */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: linear-gradient(
        rgba(0,0,0,0.8),
        rgba(20,30,50,0.9)
    );

    display: flex;
    align-items: center;
    justify-content: center;
}

.menu {
    text-align: center;
    color: white;
}

.menu h1 {
    font-size: 60px;
    color: #ffd700;
    margin-bottom: 15px;
}

.menu p {
    color: #ccc;
    margin-bottom: 25px;
}

.menu button {
    padding: 15px 45px;
    border: none;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    background: #e63946;
    color: white;
    cursor: pointer;
}

.menu button:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<!-- START MENU -->

<div id="startScreen">

    <div class="menu">

        <h1>⚔ BOX WARRIORS 3D</h1>

        <p>
            Fight realistic monsters and survive!
        </p>

        <button onclick="startGame()">
            PLAY GAME
        </button>

    </div>

</div>


<!-- GAME UI -->

<div id="ui">

    <div id="title">
        ⚔ BOX WARRIORS 3D
    </div>

    ❤️ HEALTH

    <div id="healthContainer">
        <div id="healthBar"></div>
    </div>

    <div id="stats">
        👾 Wave: <span id="wave">1</span><br>
        💀 Monsters: <span id="monsterCount">0</span><br>
        ⭐ Score: <span id="score">0</span>
    </div>

</div>


<!-- SKILLS -->

<div id="skills">

    <button class="skill" onclick="normalAttack()">
        <span>⚔</span>
        Attack
    </button>

    <button class="skill" onclick="fireSkill()">
        <span>🔥</span>
        Fire
    </button>

    <button class="skill" onclick="dashSkill()">
        <span>💨</span>
        Dash
    </button>

    <button class="skill" onclick="ultimateSkill()">
        <span>⚡</span>
        Ultimate
    </button>

</div>


<div id="instructions">

    WASD / Arrow Keys = Move<br>
    SPACE = Attack<br>
    1 = Fire Skill<br>
    2 = Dash<br>
    3 = Ultimate

</div>


<!-- THREE JS -->

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================
   VARIABLES
========================= */

let scene;
let camera;
let renderer;

let player;
let monsters = [];

let gameStarted = false;

let health = 100;
let score = 0;
let wave = 1;

let playerSpeed = 0.22;

let attacking = false;
let dashActive = false;

const keys = {};

const clock = new THREE.Clock();


/* =========================
   START GAME
========================= */

window.startGame = function () {

    document
    .getElementById("startScreen")
    .style.display = "none";

    if (!scene) {

        init();

    }

    gameStarted = true;

    spawnWave();

};


/* =========================
   INITIALIZE
========================= */

function init() {

    /* SCENE */

    scene = new THREE.Scene();

    scene.background =
    new THREE.Color(0x101820);

    scene.fog =
    new THREE.Fog(
        0x101820,
        20,
        80
    );


    /* CAMERA */

    camera =
    new THREE.PerspectiveCamera(

        70,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );

    camera.position.set(
        0,
        7,
        10
    );


    /* RENDERER */

    renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(
        renderer.domElement
    );


    /* LIGHT */

    const light =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

    light.position.set(
        10,
        15,
        10
    );

    light.castShadow = true;

    scene.add(light);


    /* AMBIENT LIGHT */

    const ambient =
    new THREE.AmbientLight(
        0x6688aa,
        2
    );

    scene.add(ambient);


    /* GROUND */

    const groundGeometry =
    new THREE.PlaneGeometry(
        100,
        100
    );

    const groundMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x263238,

        roughness: 0.8,

        metalness: 0.1

    });

    const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

    ground.rotation.x =
    -Math.PI / 2;

    ground.receiveShadow = true;

    scene.add(ground);


    /* GRID */

    const grid =
    new THREE.GridHelper(
        100,
        50,
        0x444444,
        0x222222
    );

    scene.add(grid);


    /* CREATE PLAYER */

    createPlayer();


    /* RESIZE */

    window.addEventListener(
        "resize",
        resizeGame
    );


    /* START ANIMATION */

    animate();

}


/* =========================
   CREATE PLAYER
========================= */

function createPlayer() {

    player =
    new THREE.Group();


    /* BODY */

    const bodyGeometry =
    new THREE.BoxGeometry(
        1.2,
        1.5,
        0.7
    );

    const bodyMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x1976d2,

        roughness: 0.4,

        metalness: 0.2

    });

    const body =
    new THREE.Mesh(
        bodyGeometry,
        bodyMaterial
    );

    body.position.y = 1.5;

    body.castShadow = true;

    player.add(body);


    /* HEAD */

    const headGeometry =
    new THREE.BoxGeometry(
        0.9,
        0.9,
        0.8
    );

    const headMaterial =
    new THREE.MeshStandardMaterial({

        color: 0xffccaa

    });

    const head =
    new THREE.Mesh(
        headGeometry,
        headMaterial
    );

    head.position.y = 2.7;

    head.castShadow = true;

    player.add(head);


    /* EYES */

    const eyeGeometry =
    new THREE.BoxGeometry(
        0.15,
        0.15,
        0.05
    );

    const eyeMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xffffff

    });


    const eye1 =
    new THREE.Mesh(
        eyeGeometry,
        eyeMaterial
    );

    eye1.position.set(
        -0.22,
        2.8,
        0.43
    );


    const eye2 =
    new THREE.Mesh(
        eyeGeometry,
        eyeMaterial
    );

    eye2.position.set(
        0.22,
        2.8,
        0.43
    );


    player.add(eye1);

    player.add(eye2);


    /* ARMS */

    const armGeometry =
    new THREE.BoxGeometry(
        0.35,
        1.2,
        0.35
    );


    const leftArm =
    new THREE.Mesh(
        armGeometry,
        bodyMaterial
    );

    leftArm.position.set(
        -0.8,
        1.6,
        0
    );


    const rightArm =
    new THREE.Mesh(
        armGeometry,
        bodyMaterial
    );

    rightArm.position.set(
        0.8,
        1.6,
        0
    );


    leftArm.castShadow = true;

    rightArm.castShadow = true;


    player.add(leftArm);

    player.add(rightArm);


    /* SAVE ARMS */

    player.leftArm =
    leftArm;

    player.rightArm =
    rightArm;


    scene.add(player);

}


/* =========================
   CREATE MONSTER
========================= */

function createMonster() {

    const monster =
    new THREE.Group();


    /* BODY */

    const bodyGeometry =
    new THREE.BoxGeometry(
        1.4,
        1.5,
        1
    );


    const bodyMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x6b1b1b,

        roughness: 0.8

    });


    const body =
    new THREE.Mesh(
        bodyGeometry,
        bodyMaterial
    );

    body.position.y = 1.3;

    body.castShadow = true;

    monster.add(body);


    /* HEAD */

    const headGeometry =
    new THREE.SphereGeometry(
        0.65,
        16,
        16
    );


    const headMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x8b2c2c,

        roughness: 0.7

    });


    const head =
    new THREE.Mesh(
        headGeometry,
        headMaterial
    );

    head.position.y = 2.5;

    head.castShadow = true;

    monster.add(head);


    /* GLOWING EYES */

    const eyeGeometry =
    new THREE.SphereGeometry(
        0.12,
        10,
        10
    );


    const eyeMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xff0000

    });


    const eye1 =
    new THREE.Mesh(
        eyeGeometry,
        eyeMaterial
    );

    eye1.position.set(
        -0.23,
        2.55,
        0.58
    );


    const eye2 =
    new THREE.Mesh(
        eyeGeometry,
        eyeMaterial
    );

    eye2.position.set(
        0.23,
        2.55,
        0.58
    );


    monster.add(eye1);

    monster.add(eye2);


    /* MONSTER DATA */

    monster.health =
    100 +
    wave * 20;

    monster.speed =
    0.02 +
    wave * 0.002;

    monster.damage =
    0.08 +
    wave * 0.01;

    monster.time =
    Math.random() * 10;


    /* RANDOM POSITION */

    const angle =
    Math.random() *
    Math.PI * 2;

    const distance =
    15 +
    Math.random() * 10;


    monster.position.set(

        Math.cos(angle) *
        distance,

        0,

        Math.sin(angle) *
        distance

    );


    scene.add(monster);

    monsters.push(monster);

}


/* =========================
   SPAWN WAVE
========================= */

function spawnWave() {

    const amount =
    3 + wave * 2;

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        createMonster();

    }

}


/* =========================
   PLAYER MOVEMENT
========================= */

function updatePlayer() {

    let moving = false;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        player.position.z -=
        playerSpeed;

        moving = true;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        player.position.z +=
        playerSpeed;

        moving = true;

    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        player.position.x -=
        playerSpeed;

        moving = true;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        player.position.x +=
        playerSpeed;

        moving = true;

    }


    /* WALKING ANIMATION */

    if (moving) {

        const time =
        clock.getElapsedTime();

        player.leftArm.rotation.x =
        Math.sin(time * 8) *
        0.7;

        player.rightArm.rotation.x =
        -Math.sin(time * 8) *
        0.7;

        player.position.y =
        Math.abs(
            Math.sin(time * 8)
        ) * 0.08;

    }

    else {

        player.leftArm.rotation.x =
        0;

        player.rightArm.rotation.x =
        0;

        player.position.y =
        0;

    }

}


/* =========================
   MONSTER AI
========================= */

function updateMonsters() {

    for (
        let i =
        monsters.length - 1;

        i >= 0;

        i--
    ) {

        const monster =
        monsters[i];


        const direction =
        new THREE.Vector3()

        .subVectors(
            player.position,
            monster.position
        );


        const distance =
        direction.length();


        /* LOOK AT PLAYER */

        monster.lookAt(
            player.position.x,
            monster.position.y,
            player.position.z
        );


        /* MOVE TOWARDS PLAYER */

        if (
            distance > 2
        ) {

            direction.normalize();

            monster.position.add(
                direction.multiplyScalar(
                    monster.speed
                )
            );

        }


        /* MONSTER ANIMATION */

        monster.time += 0.1;

        monster.position.y =
        Math.abs(
            Math.sin(
                monster.time * 3
            )
        ) * 0.08;


        /* ATTACK PLAYER */

        if (
            distance < 2
        ) {

            health -=
            monster.damage;

        }


        /* REMOVE DEAD MONSTER */

        if (
            monster.health <= 0
        ) {

            scene.remove(monster);

            monsters.splice(
                i,
                1
            );

            score += 10;

        }

    }


    /* NEW WAVE */

    if (
        monsters.length === 0 &&
        gameStarted
    ) {

        wave++;

        setTimeout(
            spawnWave,
            1000
        );

    }


    /* GAME OVER */

    if (
        health <= 0
    ) {

        gameOver();

    }

}


/* =========================
   NORMAL ATTACK
========================= */

window.normalAttack =
function () {

    if (
        attacking ||
        !gameStarted
    ) return;


    attacking = true;


    /* ATTACK ANIMATION */

    player.rightArm.rotation.x =
    -2;


    setTimeout(() => {

        player.rightArm.rotation.x =
        0;

        attacking = false;

    }, 250);


    damageNearbyMonsters(
        3,
        50
    );

};


/* =========================
   FIRE SKILL
========================= */

window.fireSkill =
function () {

    if (!gameStarted) return;


    createEffect(
        player.position,
        0xff5500,
        2
    );


    damageNearbyMonsters(
        6,
        80
    );

};


/* =========================
   DASH SKILL
========================= */

window.dashSkill =
function () {

    if (
        dashActive ||
        !gameStarted
    ) return;


    dashActive = true;

    const oldSpeed =
    playerSpeed;


    playerSpeed = 0.7;


    createEffect(
        player.position,
        0x00aaff,
        2
    );


    setTimeout(() => {

        playerSpeed =
        oldSpeed;

        dashActive =
        false;

    }, 1000);

};


/* =========================
   ULTIMATE SKILL
========================= */

window.ultimateSkill =
function () {

    if (!gameStarted) return;


    createEffect(
        player.position,
        0xffff00,
        5
    );


    damageNearbyMonsters(
        10,
        200
    );

};


/* =========================
   DAMAGE MONSTERS
========================= */

function damageNearbyMonsters(
range,
damage
) {

    monsters.forEach(
    monster => {

        const distance =
        monster.position.distanceTo(
            player.position
        );


        if (
            distance < range
        ) {

            monster.health -=
            damage;

        }

    });

}


/* =========================
   SKILL EFFECT
========================= */

function createEffect(
position,
color,
size
) {

    const geometry =
    new THREE.SphereGeometry(
        1,
        20,
        20
    );


    const material =
    new THREE.MeshBasicMaterial({

        color: color,

        transparent: true,

        opacity: 0.8

    });


    const effect =
    new THREE.Mesh(
        geometry,
        material
    );


    effect.position.copy(
        position
    );

    effect.position.y =
    1.5;


    scene.add(effect);


    let scale = 1;


    const animation =
    setInterval(() => {

        scale += 0.3;

        effect.scale.set(
            scale * size,
            scale * size,
            scale * size
        );


        material.opacity -=
        0.06;


        if (
            material.opacity <= 0
        ) {

            scene.remove(effect);

            clearInterval(animation);

        }

    }, 30);

}


/* =========================
   CAMERA
========================= */

function updateCamera() {

    const target =
    new THREE.Vector3(

        player.position.x,

        player.position.y + 6,

        player.position.z + 10

    );


    camera.position.lerp(
        target,
        0.08
    );


    camera.lookAt(

        player.position.x,

        player.position.y + 1.5,

        player.position.z

    );

}


/* =========================
   UI
========================= */

function updateUI() {

    health =
    Math.max(
        health,
        0
    );


    document
    .getElementById("healthBar")
    .style.width =
    health + "%";


    document
    .getElementById("score")
    .textContent =
    score;


    document
    .getElementById("wave")
    .textContent =
    wave;


    document
    .getElementById("monsterCount")
    .textContent =
    monsters.length;

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    gameStarted =
    false;


    alert(

        "GAME OVER!\n\n" +

        "Score: " + score +

        "\nWave: " + wave

    );


    location.reload();

}


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
"keydown",
event => {

    keys[
        event.key.toLowerCase()
    ] = true;


    if (
        event.code === "Space"
    ) {

        normalAttack();

    }


    if (
        event.key === "1"
    ) {

        fireSkill();

    }


    if (
        event.key === "2"
    ) {

        dashSkill();

    }


    if (
        event.key === "3"
    ) {

        ultimateSkill();

    }

});


window.addEventListener(
"keyup",
event => {

    keys[
        event.key.toLowerCase()
    ] = false;

});


/* =========================
   RESIZE
========================= */

function resizeGame() {

    camera.aspect =
    window.innerWidth /
    window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* =========================
   ANIMATION LOOP
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (gameStarted) {

        updatePlayer();

        updateMonsters();

        updateCamera();

        updateUI();

    }


    renderer.render(
        scene,
        camera
    );

}

</script>

</body>
</html>
