<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Box Warriors: Real 3D</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#loading {
    position: fixed;
    inset: 0;
    background: #050505;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 24px;
    z-index: 100;
}

/* HUD */

#hud {
    position: fixed;
    top: 20px;
    left: 20px;
    color: white;
    z-index: 10;
}

#healthBackground {
    width: 250px;
    height: 24px;
    background: #300;
    border: 2px solid white;
}

#health {
    width: 100%;
    height: 100%;
    background: #22c55e;
    transition: width 0.2s;
}

#stats {
    margin-top: 12px;
    line-height: 1.6;
}

/* Skills */

#skills {
    position: fixed;
    bottom: 30px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 15px;

    z-index: 10;
}

.skill {
    width: 90px;
    height: 90px;

    border-radius: 15px;

    border: 2px solid white;

    background: rgba(0,0,0,0.7);

    color: white;

    cursor: pointer;

    font-size: 13px;
}

.skill:hover {
    transform: scale(1.1);
}

.icon {
    display: block;
    font-size: 30px;
}

/* Controls */

#help {
    position: fixed;

    right: 20px;
    bottom: 20px;

    color: white;

    text-align: right;

    z-index: 10;

    font-size: 14px;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<div id="loading">
    Loading 3D Character...
</div>

<div id="hud">

    <h2>⚔ 3D WARRIOR</h2>

    ❤️ HEALTH

    <div id="healthBackground">
        <div id="health"></div>
    </div>

    <div id="stats">

        💀 Score:
        <span id="score">0</span>

        <br>

        👾 Monsters:
        <span id="monsters">0</span>

    </div>

</div>


<div id="skills">

    <button
    class="skill"
    onclick="attack()">

        <span class="icon">⚔️</span>

        ATTACK

    </button>


    <button
    class="skill"
    onclick="fireSkill()">

        <span class="icon">🔥</span>

        FIRE

    </button>


    <button
    class="skill"
    onclick="lightningSkill()">

        <span class="icon">⚡</span>

        LIGHTNING

    </button>


    <button
    class="skill"
    onclick="dashSkill()">

        <span class="icon">💨</span>

        DASH

    </button>

</div>


<div id="help">

    WASD = Move<br>

    SHIFT = Run<br>

    SPACE = Attack<br>

    1 = Fire Skill<br>

    2 = Lightning<br>

    3 = Dash

</div>


<script type="module">

/* ================================
   IMPORT THREE.JS
================================ */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* ================================
   GAME VARIABLES
================================ */

let scene;
let camera;
let renderer;

let player;

let mixer;

let animations = {};

let currentAction;

let health = 100;

let score = 0;

let monsters = [];

let speed = 0.12;

let runningSpeed = 0.25;

let attacking = false;

const clock = new THREE.Clock();

const keys = {};


/* ================================
   INITIALIZE
================================ */

init();


function init() {

    /* SCENE */

    scene = new THREE.Scene();

    scene.background =
    new THREE.Color(0x202a32);

    scene.fog =
    new THREE.Fog(
        0x202a32,
        15,
        100
    );


    /* CAMERA */

    camera =
    new THREE.PerspectiveCamera(

        70,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );


    camera.position.set(
        0,
        5,
        8
    );


    /* RENDERER */

    renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.shadowMap.enabled =
    true;


    renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


    document.body.appendChild(
        renderer.domElement
    );


    /* LIGHTS */

    const sunlight =
    new THREE.DirectionalLight(

        0xffffff,

        3

    );


    sunlight.position.set(
        10,
        20,
        10
    );


    sunlight.castShadow =
    true;


    sunlight.shadow.mapSize.width =
    2048;


    sunlight.shadow.mapSize.height =
    2048;


    scene.add(sunlight);


    const ambient =
    new THREE.HemisphereLight(

        0x87ceeb,

        0x222222,

        2

    );


    scene.add(ambient);


    /* GROUND */

    createGround();


    /* LOAD CHARACTER */

    loadCharacter();


    /* CREATE MONSTERS */

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        createMonster();

    }


    /* EVENTS */

    window.addEventListener(
        "keydown",
        keyDown
    );


    window.addEventListener(
        "keyup",
        keyUp
    );


    window.addEventListener(
        "resize",
        resize
    );


    animate();

}


/* ================================
   GROUND
================================ */

function createGround() {

    const geometry =
    new THREE.PlaneGeometry(
        200,
        200
    );


    const material =
    new THREE.MeshStandardMaterial({

        color: 0x2f4f3a,

        roughness: 1

    });


    const ground =
    new THREE.Mesh(
        geometry,
        material
    );


    ground.rotation.x =
    -Math.PI / 2;


    ground.receiveShadow =
    true;


    scene.add(ground);

}


/* ================================
   LOAD HUMAN CHARACTER
================================ */

function loadCharacter() {

    const loader =
    new GLTFLoader();


    loader.load(

        "./assets/character.glb",


        function(gltf) {

            player =
            gltf.scene;


            player.scale.set(
                1.5,
                1.5,
                1.5
            );


            player.position.set(
                0,
                0,
                0
            );


            player.traverse(
            function(object) {

                if (
                    object.isMesh
                ) {

                    object.castShadow =
                    true;

                    object.receiveShadow =
                    true;

                }

            });


            scene.add(player);


            /* ANIMATION MIXER */

            mixer =
            new THREE.AnimationMixer(
                player
            );


            gltf.animations.forEach(
            clip => {

                animations[
                    clip.name.toLowerCase()
                ] =

                mixer.clipAction(
                    clip
                );

            });


            /* DEFAULT ANIMATION */

            playAnimation(
                "idle"
            );


            document
            .getElementById(
                "loading"
            )
            .style.display =
            "none";

        },


        undefined,


        function(error) {

            console.error(
                error
            );


            document
            .getElementById(
                "loading"
            )
            .textContent =

            "Character model not found. " +

            "Add assets/character.glb";

        }

    );

}


/* ================================
   PLAY ANIMATION
================================ */

function playAnimation(name) {

    if (
        !animations[name]
    ) return;


    const next =
    animations[name];


    if (
        currentAction === next
    ) return;


    if (
        currentAction
    ) {

        currentAction.fadeOut(
            0.2
        );

    }


    next

    .reset()

    .fadeIn(
        0.2
    )

    .play();


    currentAction =
    next;

}


/* ================================
   MOVEMENT
================================ */

function updatePlayer() {

    if (!player) return;


    let moving =
    false;


    let currentSpeed =
    keys["shift"]

    ? runningSpeed

    : speed;


    if (keys["w"]) {

        player.position.z -=
        currentSpeed;

        moving = true;

    }


    if (keys["s"]) {

        player.position.z +=
        currentSpeed;

        moving = true;

    }


    if (keys["a"]) {

        player.position.x -=
        currentSpeed;

        moving = true;

    }


    if (keys["d"]) {

        player.position.x +=
        currentSpeed;

        moving = true;

    }


    /* CHARACTER ANIMATION */

    if (
        moving &&
        !attacking
    ) {

        if (
            keys["shift"]
        ) {

            playAnimation(
                "run"
            );

        }

        else {

            playAnimation(
                "walk"
            );

        }

    }


    else if (
        !attacking
    ) {

        playAnimation(
            "idle"
        );

    }

}


/* ================================
   NORMAL ATTACK
================================ */

window.attack =
function() {

    if (
        attacking ||
        !player
    ) return;


    attacking =
    true;


    playAnimation(
        "attack"
    );


    createSlashEffect();


    damageMonsters(
        4,
        50
    );


    setTimeout(
    function() {

        attacking =
        false;


        playAnimation(
            "idle"
        );

    },

    600
    );

};


/* ================================
   FIRE SKILL
================================ */

window.fireSkill =
function() {

    if (!player) return;


    createFireEffect();


    damageMonsters(
        7,
        100
    );

};


/* ================================
   LIGHTNING SKILL
================================ */

window.lightningSkill =
function() {

    if (!player) return;


    createLightningEffect();


    damageMonsters(
        10,
        150
    );

};


/* ================================
   DASH SKILL
================================ */

window.dashSkill =
function() {

    if (!player) return;


    const direction =
    new THREE.Vector3(
        0,
        0,
        -1
    );


    player.position.add(
        direction.multiplyScalar(
            4
        )
    );


    createDashEffect();

};


/* ================================
   DAMAGE MONSTERS
================================ */

function damageMonsters(
range,
damage
) {

    monsters.forEach(
    monster => {

        if (!player) return;


        const distance =

        monster.position.distanceTo(
            player.position
        );


        if (
            distance < range
        ) {

            monster.health -=
            damage;

        }

    });

}


/* ================================
   REALISTIC MONSTER STARTER
================================ */

function createMonster() {

    const monster =
    new THREE.Group();


    /* BODY */

    const bodyGeometry =
    new THREE.CapsuleGeometry(
        0.6,
        1.8,
        8,
        16
    );


    const bodyMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x553333,

        roughness: 0.9,

        metalness: 0.1

    });


    const body =
    new THREE.Mesh(
        bodyGeometry,
        bodyMaterial
    );


    body.position.y =
    1.5;


    body.castShadow =
    true;


    monster.add(body);


    /* HEAD */

    const headGeometry =
    new THREE.SphereGeometry(
        0.65,
        32,
        32
    );


    const headMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x774444

    });


    const head =
    new THREE.Mesh(
        headGeometry,
        headMaterial
    );


    head.position.y =
    2.7;


    monster.add(head);


    /* EYES */

    const eyeMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xff0000

    });


    for (

        let x of
        [-0.25, 0.25]

    ) {

        const eye =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                0.12,
                12,
                12
            ),

            eyeMaterial

        );


        eye.position.set(
            x,
            2.75,
            0.58
        );


        monster.add(eye);

    }


    monster.health =
    100;


    monster.speed =
    0.025;


    /* RANDOM POSITION */

    const angle =
    Math.random() *
    Math.PI * 2;


    monster.position.set(

        Math.cos(angle) * 15,

        0,

        Math.sin(angle) * 15

    );


    scene.add(
        monster
    );


    monsters.push(
        monster
    );

}


/* ================================
   MONSTER AI
================================ */

function updateMonsters() {

    if (!player) return;


    for (

        let i =
        monsters.length - 1;

        i >= 0;

        i--

    ) {

        const monster =
        monsters[i];


        const direction =
        new THREE.Vector3()

        .subVectors(

            player.position,

            monster.position

        );


        const distance =
        direction.length();


        monster.lookAt(

            player.position.x,

            monster.position.y,

            player.position.z

        );


        if (
            distance > 2
        ) {

            direction.normalize();


            monster.position.add(

                direction.multiplyScalar(

                    monster.speed

                )

            );

        }


        /* Damage Player */

        if (
            distance < 2
        ) {

            health -=
            0.08;

        }


        /* Death */

        if (
            monster.health <= 0
        ) {

            scene.remove(
                monster
            );


            monsters.splice(
                i,
                1
            );


            score += 10;

        }

    }


    /* Respawn */

    if (
        monsters.length === 0
    ) {

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            createMonster();

        }

    }

}


/* ================================
   VISUAL EFFECTS
================================ */

function createSlashEffect() {

    if (!player) return;


    const effect =
    new THREE.Mesh(

        new THREE.TorusGeometry(
            1.5,
            0.1,
            8,
            32,
            Math.PI
        ),

        new THREE.MeshBasicMaterial({

            color: 0xffffff,

            transparent: true,

            opacity: 1

        })

    );


    effect.position.copy(
        player.position
    );


    effect.position.y =
    1.5;


    scene.add(effect);


    animateEffect(
        effect
    );

}


function createFireEffect() {

    createSphereEffect(
        0xff4400,
        2
    );

}


function createLightningEffect() {

    createSphereEffect(
        0x00ccff,
        3
    );

}


function createDashEffect() {

    createSphereEffect(
        0xffffff,
        1
    );

}


function createSphereEffect(
color,
size
) {

    if (!player) return;


    const geometry =
    new THREE.SphereGeometry(
        1,
        32,
        32
    );


    const material =
    new THREE.MeshBasicMaterial({

        color: color,

        transparent: true,

        opacity: 0.7

    });


    const effect =
    new THREE.Mesh(
        geometry,
        material
    );


    effect.position.copy(
        player.position
    );


    effect.position.y =
    1.5;


    scene.add(effect);


    effect.scale.set(
        0.2,
        0.2,
        0.2
    );


    const interval =
    setInterval(
    () => {

        effect.scale.multiplyScalar(
            1.2
        );


        material.opacity -=
        0.05;


        if (
            material.opacity <= 0
        ) {

            scene.remove(
                effect
            );


            clearInterval(
                interval
            );

        }

    },

    30
    );

}


function animateEffect(
effect
) {

    let scale =
    1;


    const interval =
    setInterval(
    () => {

        scale +=
        0.2;


        effect.scale.set(
            scale,
            scale,
            scale
        );


        effect.material.opacity -=
        0.06;


        if (
            effect.material.opacity <=
            0
        ) {

            scene.remove(
                effect
            );


            clearInterval(
                interval
            );

        }

    },

    30
    );

}


/* ================================
   CAMERA
================================ */

function updateCamera() {

    if (!player) return;


    const desired =
    new THREE.Vector3(

        player.position.x,

        player.position.y + 5,

        player.position.z + 8

    );


    camera.position.lerp(
        desired,
        0.08
    );


    camera.lookAt(

        player.position.x,

        player.position.y + 1.5,

        player.position.z

    );

}


/* ================================
   UI
================================ */

function updateUI() {

    health =
    Math.max(
        health,
        0
    );


    document
    .getElementById(
        "health"
    )
    .style.width =
    health + "%";


    document
    .getElementById(
        "score"
    )
    .textContent =
    score;


    document
    .getElementById(
        "monsters"
    )
    .textContent =
    monsters.length;

}


/* ================================
   KEYBOARD
================================ */

function keyDown(event) {

    keys[
        event.key.toLowerCase()
    ] = true;


    if (
        event.code ===
        "Space"
    ) {

        attack();

    }


    if (
        event.key === "1"
    ) {

        fireSkill();

    }


    if (
        event.key === "2"
    ) {

        lightningSkill();

    }


    if (
        event.key === "3"
    ) {

        dashSkill();

    }

}


function keyUp(event) {

    keys[
        event.key.toLowerCase()
    ] = false;

}


/* ================================
   RESIZE
================================ */

function resize() {

    camera.aspect =
    window.innerWidth /
    window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* ================================
   GAME LOOP
================================ */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
    clock.getDelta();


    if (mixer) {

        mixer.update(
            delta
        );

    }


    updatePlayer();

    updateMonsters();

    updateCamera();

    updateUI();


    renderer.render(

        scene,

        camera

    );

}

</script>

</body>
</html>
